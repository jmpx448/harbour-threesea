# SPDX-License-Identifier: AGPL-3.0-only
# Coverage-guided fuzzing of the decoders that take input from outside (deep audit open item).
# Not part of the app or the workspace: `cargo +nightly fuzz run <target>` in core/ (docs/build.md).
[package]
name = "threesea-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
threesea-core = { path = ".." }
# Only what targets need to get past a seal or to build a message: versions as in the core.
crypto_secretbox = { version = "0.1.1", default-features = false, features = ["alloc", "getrandom", "salsa20"] }
libthreema = { path = "../../third_party/libthreema/lib" }
prost = "=0.14.4"
serde_json = "1"
rmpv = { version = "=1.3.1", default-features = false }
zeroize = "1"

# Its own workspace: fuzzing builds with nightly and sanitizers, never with the app.
[workspace]

[patch.crates-io]
blake2 = { path = "../../third_party/libthreema/patches/blake2" }
opus-pure = { path = "../../third_party/opus-pure" }

[[bin]]
name = "voice_decode"
path = "fuzz_targets/voice_decode.rs"
test = false
doc = false
bench = false

